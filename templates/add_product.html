{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container" style="max-width: 680px;">
    <span class="eyebrow">Kitchen Admin</span>
    <h1 style="margin-bottom: 24px;">Add New Dish</h1>
    <div class="panel">
      <form method="post" action="{{ url_for('admin_views.add_product') }}">
        <div class="form-group">
          <label for="name" class="form-label">Dish Name *</label>
          <input type="text" class="form-control" id="name" name="name" required placeholder="e.g. Truffle Burrata Pizza">
        </div>
        <div class="form-group">
          <label for="category" class="form-label">Category *</label>
          <select class="form-control" id="category" name="category" required>
            <option value="Pizza">Pizza</option>
            <option value="Sushi">Sushi</option>
            <option value="SushiSet">SushiSet</option>
          </select>
        </div>
        <div class="form-group">
          <label for="description" class="form-label">Description *</label>
          <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label for="price" class="form-label">Price (€) *</label>
          <input type="number" step="0.01" min="0.5" class="form-control" id="price" name="price" required>
        </div>
        <div class="form-group">
          <label for="image" class="form-label">Image Filename (inside static/img/) *</label>
          <input type="text" class="form-control" id="image" name="image" required value="margherita.png">
        </div>
        <div style="display: flex; gap: 12px;">
          <button type="submit" class="btn btn-primary">Save Dish</button>
          <a href="{{ url_for('main.menu') }}" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
